        sourceType:
          $ref: "#/components/schemas/JobSourceType"
        externalJobId:
          type: string
        listingUrl:
          description: Validated HTTP(S) source listing URL.
          format: uri
          pattern: "^https?://"
          type: string
        applyUrl:
          description: Validated HTTP(S) application URL.
          format: uri
          pattern: "^https?://"
          type: string
        directApply:
          type: boolean
        providerPostedAt:
          deprecated: true
          description: Legacy timezone-less value retained for compatibility.
          format: date-time
          type: string
        providerPostedAtRaw:
          type: string
        providerPostedAtUtc:
          format: date-time

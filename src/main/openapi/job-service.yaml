        applicationDeadlineAtUtc:
          description: Explicit application deadline instant when distinct from listing expiry.
          format: date-time
          type: string
        distanceMiles:
          format: double
          type: number
        remote:
          deprecated: true
          description: Legacy Boolean retained for compatibility. False does not imply ON_SITE.
          type: boolean
        description:
          type: string
        url:
          description: Preferred validated HTTP(S) application URL.
          format: uri
          pattern: "^https?://"
          type: string
        sourceUrl:
          description: Preferred validated HTTP(S) source listing URL.
          format: uri
          pattern: "^https?://"
          type: string
        sources:
          items:
            $ref: "#/components/schemas/JobSourceReference"
          type: array
        skills:
          items:
            $ref: "#/components/schemas/JobSkill"
          type: array
        experience:
          $ref: "#/components/schemas/JobExperience"
        fieldProvenance:
          description: Field-level raw/normalised evidence. Sensitive provider payloads are never retained here.
          items:
            $ref: "#/components/schemas/JobFieldProvenance"
          type: array
        matchScore:
          format: double
          type: number
        applicationStatus:
          type: string
        applicationId:
          format: uuid
          type: string
        cvDocumentId:
          type: string
        coverLetterDocumentId:
          type: string
        appliedAt:
          format: date-time
          type: string
        applicationUpdatedAt:
          format: date-time
          type: string
      required:

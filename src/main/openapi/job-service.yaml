          description: Version of the additive canonical Job field dictionary.
          example: "2.0"
          type: string
        id:
          deprecated: true
          description: Legacy alias of canonicalJobId retained for compatibility.
          type: string
        canonicalJobId:
          type: string
        provider:
          deprecated: true
          description: Legacy alias of primarySource retained for compatibility.
          type: string
        primarySource:
          type: string
        externalJobId:
          type: string
        title:

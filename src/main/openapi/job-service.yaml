      - canonicalJobId
      - primarySource
      - externalJobId
      - employmentTypeCode
      - contractTypeCode
      - workplaceType
      - sources
      - skills
      - experience
      - fieldProvenance
      type: object
    CanonicalLocation:
      properties:
        rawDisplayName:
          description: Provider display label retained without normalisation.
          type: string
        rawCity:
          type: string
        rawRegion:
          type: string
        rawCountry:
          type: string
        displayName:
          type: string
        postcode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        areaParts:
          items:
            type: string
          type: array
        city:
          type: string
        region:
          type: string
        countryCode:
          description: Normalised ISO country code only when confidently mapped.
          type: string
        sourceProvider:
          type: string
        normalisationStatus:
          $ref: "#/components/schemas/CanonicalValueStatus"
        normalisationConfidence:
          maximum: 1
          minimum: 0
          type: number
      required:
      - normalisationStatus
      type: object
    JobSourceReference:
      properties:
        integrationProvider:

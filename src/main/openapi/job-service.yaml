          type: string
        message:
          example: A valid Bearer access token is required.
          type: string
        correlationId:
          type: string
      required:
      - schemaVersion
      - code
      - message
      - correlationId
      type: object
    ErrorResponse:
      example:
        error: error
        message: message
      properties:
        error:
          type: string
        message:
          type: string
      type: object
    Aspirations:
      description: "User aspirations for job search including desired roles, locations,\
        \ and salary expectations"
      example:
        desiredRoles:
        - desiredRoles
        - desiredRoles
        industries:
        - industries
        - industries
        salaryExpectation:
          min: 0
          max: 6
          currency: currency
        locations:
        - locations
        - locations
      properties:
        desiredRoles:
          items:
            type: string
          type: array
        industries:
          items:
            type: string
          type: array
        salaryExpectation:
          $ref: "#/components/schemas/SalaryExpectation"
        locations:
          items:
            type: string
          type: array
      type: object
    JobSearchRequest:
      description: Job search criteria based on user profile
      example:
        aspirations:
          desiredRoles:
          - desiredRoles
          - desiredRoles
          industries:
          - industries
          - industries
          salaryExpectation:
            min: 0
            max: 6
            currency: currency
          locations:
          - locations
          - locations
        workPreferences:
          employmentType:
          - employmentType
          - employmentType
          remotePreference: remotePreference
          companySize:
          - companySize
          - companySize
          culture:
          - culture
          - culture
        homeLocation:
          displayName: London
          postcode: SW1A 1AA
          latitude: 51.501
          longitude: -0.142
        selectedProviders:
        - REED
        - ADZUNA
      properties:
        aspirations:
          $ref: "#/components/schemas/Aspirations"
        workPreferences:
          $ref: "#/components/schemas/WorkPreferences"
        homeLocation:
          $ref: "#/components/schemas/HomeLocation"
        selectedProviders:
          description: Optional integration providers to search. Empty or omitted means all enabled providers.
          items:
            type: string
          type: array
      required:
      - aspirations
      type: object
    HomeLocation:
      description: User home location used for provider radius queries and distance sorting
      properties:
        displayName:
          description: Human-readable location label
          type: string
        postcode:
          description: User postcode when available
          type: string
        latitude:
          description: WGS84 latitude
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          description: WGS84 longitude
          format: double
          maximum: 180
          minimum: -180
          type: number
      type: object
    SalaryExpectation:
      example:
        min: 0
        max: 6
        currency: currency
      properties:
        min:
          format: int32
          type: integer
        max:
          format: int32
          type: integer
        currency:
          type: string
      type: object
    WorkPreferences:
      description: Work preferences including employment types and location preferences
      example:
        employmentType:
        - employmentType
        - employmentType
        remotePreference: remotePreference
        companySize:
        - companySize
        - companySize
        culture:
        - culture
        - culture
      properties:
        employmentType:
          items:
            type: string
          type: array
        remotePreference:
          type: string
        companySize:
          items:
            type: string
          type: array
        culture:
          items:
            type: string
          type: array
      type: object
    Job:
      example:
        canonicalSchemaVersion: "2.0"
        id: id
        canonicalJobId: canonical-id
        provider: REED
        primarySource: REED
        externalJobId: external-id
        title: title
        jobTitle: title
        company: company
        companyName: company
        location: location
        salary:
          min: 0
          max: 6
          currency: currency
        employmentType: employmentType
        postedDate: postedDate
        description: description
        url: url
        matchScore: 1.4658129805029452
      properties:

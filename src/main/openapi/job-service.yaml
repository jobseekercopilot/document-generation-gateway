openapi: 3.0.1
info:
  contact:
    name: Jobseeker Copilot
  description: |
    Service for searching and retrieving job listings.

    This service aggregates external job sources through provider gateways.
    It transforms user profile data (aspirations, work preferences) into
    bounded concurrent searches and returns canonical job results.

    Saved jobs are owner-scoped, durable selections backed by immutable
    canonical/source snapshots. The service does not call external provider
    APIs directly or index/rank jobs.
  license:
    name: Proprietary source-available
  title: Jobseeker Copilot - Job Service API
  version: 2.0.0
servers:
- description: Generated server url
  url: http://localhost:8086
tags:
- description: Endpoints for searching job listings
  name: Job Search
- description: Owner-scoped immutable canonical job snapshots
  name: Saved Jobs
paths:
  /api/jobs/search:
    post:
      description: "Searches for jobs based on user aspirations and work preferences.\
        \ Requires a signed end-user Bearer access token. The verified JWT subject\
        \ is the only search identity."
      operationId: searchJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSearchRequest"
        required: true
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
          description: Missing or invalid Bearer access token
        "503":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: No requested provider was enabled or every attempted provider failed
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReedJobSearchResponse"
          description: OK
      summary: Search for jobs
      tags:
      - Job Search
      security:
      - bearerAuth: []
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /api/jobs/saved:
    get:
      operationId: list
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJobPageResponse"
          description: Active saved jobs owned by the authenticated user
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid page or size
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
          description: Missing or invalid Bearer access token
      security:
      - bearerAuth: []
      summary: List the current user's active saved jobs
      tags:
      - Saved Jobs
    post:
      description: |
        Creates or reactivates one owner-scoped saved job. Identical canonical
        content replays the same immutable snapshot; changed source content
        appends a snapshot without deleting earlier provenance. The
        X-Saved-Job-Outcome response header is CREATED, REPLAYED, UPDATED or
        REACTIVATED.
      operationId: save
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Job"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJobResponse"
          description: Saved job created
          headers:
            X-Saved-Job-Outcome:
              schema:
                enum:
                - CREATED
                type: string
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJobResponse"
          description: Existing saved job replayed, updated or reactivated
          headers:
            X-Saved-Job-Outcome:
              schema:
                enum:
                - REPLAYED
                - UPDATED
                - REACTIVATED
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or unsupported canonical job snapshot
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
          description: Missing or invalid Bearer access token
      security:
      - bearerAuth: []
      summary: Save a canonical job snapshot
      tags:
      - Saved Jobs
      x-content-type: application/json
  /api/jobs/saved/{savedJobId}:
    get:
      description: |
        Returns the current immutable canonical/source snapshot. Missing,
        unsaved and other-user identifiers return the same not-found response.
      operationId: get
      parameters:
      - in: path
        name: savedJobId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJobResponse"
          description: Saved job found
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
          description: Missing or invalid Bearer access token
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Saved job not found
      security:
      - bearerAuth: []
      summary: Retrieve an owner-scoped saved job snapshot
      tags:
      - Saved Jobs
    delete:
      description: |
        Idempotently removes the saved job from the owner's active list while
        retaining immutable snapshot provenance.
      operationId: unsave
      parameters:
      - in: path
        name: savedJobId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: Job is not active
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationError"
          description: Missing or invalid Bearer access token
      security:
      - bearerAuth: []
      summary: Unsave a job
      tags:
      - Saved Jobs
components:

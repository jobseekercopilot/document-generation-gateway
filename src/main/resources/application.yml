server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: document-generation-gateway
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

document-generation:
  security:
    jwk-set-uri: ${AUTH_JWKS_URI:http://authentication-service:8084/.well-known/jwks.json}
    issuer: ${DOCUMENT_GENERATION_JWT_ISSUER:job-seeker-copilot-authentication}
    audience: ${DOCUMENT_GENERATION_JWT_AUDIENCE:job-seeker-copilot-services}
    authentication-service-token: ${AUTH_SERVICE_TOKEN:}
    application-tracker-producer-token: ${APPLICATION_TRACKER_PRODUCER_TOKEN:}
    document-export-service-token: ${DOCUMENT_EXPORT_GATEWAY_TOKEN:}
    document-store-producer-token: ${DOCUMENT_STORE_PRODUCER_TOKEN:}
    document-store-reader-token: ${DOCUMENT_STORE_READER_TOKEN:}

services:
  user-profile-service:
    base-url: ${USER_PROFILE_SERVICE_URL:http://user-profile-service:8085}
  authentication-service:
    base-url: ${AUTHENTICATION_SERVICE_URL:http://authentication-service:8084}
  job-service:
    base-url: ${JOB_SERVICE_URL:http://job-service:8086}
  cv-cover-letter-service:
    base-url: ${CV_COVER_LETTER_SERVICE_URL:http://cv-cover-letter-service:8091}
  document-export-service:
    base-url: ${DOCUMENT_EXPORT_SERVICE_URL:http://document-export-service:8094}
  document-store-service:
    base-url: ${DOCUMENT_STORE_SERVICE_URL:http://document-store-service:8089}
  application-tracker-service:
    base-url: ${APPLICATION_TRACKER_SERVICE_URL:http://application-tracker-service:8088}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
